<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="hpTitle">
  <title id="hpTitle">Illustration of a cylinder proofing press</title>
  <ellipse cx="300" cy="404" rx="230" ry="14" fill="#241E17" opacity="0.12"/>

  <!-- legs -->
  <rect x="126" y="352" width="34" height="46" fill="#241E17"/>
  <rect x="440" y="352" width="34" height="46" fill="#241E17"/>
  <rect x="110" y="392" width="66" height="12" fill="#241E17"/>
  <rect x="424" y="392" width="66" height="12" fill="#241E17"/>

  <!-- bed -->
  <rect x="96" y="326" width="410" height="28" fill="#241E17"/>

  <!-- locked type on the bed -->
  <rect x="118" y="240" width="160" height="12" fill="#241E17"/>
  <rect x="118" y="258" width="120" height="12" fill="#241E17"/>
  <rect x="118" y="276" width="145" height="12" fill="#241E17"/>
  <rect x="118" y="294" width="95"  height="12" fill="#7C2A1E"/>
  <rect x="108" y="228" width="182" height="8" fill="#241E17"/>
  <rect x="108" y="306" width="182" height="8" fill="#241E17"/>

  <!-- cylinder -->
  <circle cx="418" cy="260" r="86" fill="none" stroke="#241E17" stroke-width="18"/>
  <circle cx="418" cy="260" r="16" fill="#7C2A1E"/>

  <!-- crank handle -->
  <rect x="470" y="192" width="11" height="58" fill="#241E17" transform="rotate(34 475 221)"/>
  <circle cx="500" cy="190" r="13" fill="#7C2A1E"/>

  <!-- ink disc + rollers above -->
  <circle cx="418" cy="122" r="30" fill="none" stroke="#241E17" stroke-width="10"/>
  <circle cx="365" cy="150" r="13" fill="#7C2A1E"/>
  <circle cx="471" cy="150" r="13" fill="#7C2A1E"/>

  <!-- frame upright supporting ink disc -->
  <rect x="411" y="150" width="14" height="46" fill="#241E17"/>
</svg>
